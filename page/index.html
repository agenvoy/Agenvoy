<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenvoy</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_2,add_comment,arrow_downward_alt,arrow_upward_alt,book_2,cached,cell_tower,check_circle,checklist,clear_all,close,cognition_2,compress,construction,content_copy,delete,deployed_code,deployed_code_account,docs,electrical_services,folder,key,keyboard_arrow_down,lightbulb_2,more_horiz,progress_activity,radio_button_unchecked,right_panel_close,robot_2,schedule,send,settings,stop"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/brands.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/fontawesome.min.css"
    />
    <link rel="stylesheet" href="public/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/@pardnchiu/quickui@v0.6.21/dist/QuickUI.js"></script>

    <script src="public/index.js"></script>
    <script src="https://cloud.pardn.io/nanomd-pre-test-v1.js"></script>
    <script src="https://cloud.pardn.io/voice.js"></script>
  </head>
  <body id="app" data-rendered="0">
    <!---->
    <section class="left-tab" :data-collapsed="{{collapsed}}">
      <!---->
      <header>
        <img src="public/logo-min.svg" alt="Logo" />
        <p>Agenvoy</p>
        <button type="button" @click="show_tab">
          <span class="material-symbols-outlined"> right_panel_close </span>
        </button>
      </header>
      <!---->
      <section>
        <a :for="(k, v) in left_tab" :href="{{v.href}}">
          <span class="material-symbols-outlined"> {{v.icon}} </span>
          <p>{{k}}</p>
        </a>
      </section>
      <!---->
      <section class="chats">
        <!---->
        <details class="group" open>
          <summary>
            Channels
            <span class="material-symbols-outlined"> keyboard_arrow_down </span>
          </summary>
          <section id="left-tab-channel-list"></section>
        </details>
        <!---->
        <details class="group" open>
          <summary>
            Chats
            <span class="material-symbols-outlined"> keyboard_arrow_down </span>
          </summary>
          <section id="left-tab-chat-list"></section>
        </details>
      </section>
      <!---->
      <footer>
        <a href="https://web.agenvoy.com/config?tab=models" target="_blank" rel="noreferrer">
          <span class="material-symbols-outlined"> settings </span>
          <p>Config</p>
        </a>
        <a href="/?page=config&tab=Model">
          <span class="material-symbols-outlined"> settings </span>
          <p>New Config (Building)</p>
        </a>
      </footer>
    </section>
    <!---->
    <section class="right-content">
      <!---->
      <section :if="params.page == chat" class="chat" :data-id="{{params.chat}}" @wheel="chat_wheel">
        <header>
          <p></p>
          <div></div>
          <button type="button" title="summary" @click="memory_summary">
            <span class="material-symbols-outlined"> cognition_2 </span>
          </button>
          <button type="button" title="compact" @click="memory_compact">
            <span class="material-symbols-outlined"> compress </span>
          </button>
          <button type="button" title="reset" @click="memory_reset">
            <span class="material-symbols-outlined"> clear_all </span>
          </button>
        </header>
        <!---->
        <div class="logo">
          <img src="public/logo-min.svg" alt="Logo" />
          <p>Agenvoy</p>
        </div>
        <!---->
        <section id="right-content-chat-messages" class="messages">
          <!---->
          <section id="right-content-chat-todo" class="todo"></section>
          <!---->
          <section id="right-content-chat-pending" class="pending" data-index="0"></section>
          <!---->
          <section id="right-content-chat-confirm" class="confirm"></section>
        </section>
        <!---->
        <div class="input" data-voice="0">
          <span></span>
          <label dir="auto">
            <textarea
              id="chat-input"
              placeholder="How can I help you today?"
              @input="chat_input"
              @keydown="chat_keydown"
            ></textarea>
            <pre></pre>
          </label>
          <section>
            <label class="rule">
              <select id="chat-rule" @change="rule_change">
                <option value="">default</option>
              </select>
              <span class="material-symbols-outlined"> keyboard_arrow_down </span>
            </label>
            <button class="skill" type="button" @click="skill_pick">
              <span class="material-symbols-outlined"> lightbulb_2 </span>
            </button>
            <button class="work-dir" type="button" @click="workdir_pick">
              <span class="material-symbols-outlined"> folder </span>
            </button>
            <div></div>
            <label class="model">
              <select id="chat-model" @change="model_change">
                <option value="auto">auto</option>
              </select>
              <span class="material-symbols-outlined"> keyboard_arrow_down </span>
            </label>
            <label class="model">
              <select id="chat-reasoning" @change="reasoning_change">
                <option value="none">none</option>
                <option value="low">low</option>
                <option value="medium" selected>medium</option>
                <option value="high">high</option>
                <option value="xhigh">xhigh</option>
                <option value="max">max</option>
              </select>
              <span class="material-symbols-outlined"> keyboard_arrow_down </span>
            </label>
            <button class="harness" type="button" @click="harness_click">
              <span class="material-symbols-outlined"> robot_2 </span>
            </button>
            <button class="send" type="button" @click="send_click">
              <span class="material-symbols-outlined"> send </span>
            </button>
          </section>
        </div>
      </section>
      <!---->
      <section :elif="params.page == features" class="feature">
        <header :data-selected="{{params.tab}}">
          <a :for="(k, v) in feature" :href="?page=features&tab={{k}}" :name="{{k}}">
            <span class="material-symbols-outlined"> {{v}} </span>
            <p>{{k}}</p>
          </a>
          <div></div>
        </header>

        <section :if="params.tab == Rules" class="editor">
          <div class="side">
            <button type="button" class="new" @click="rule_reset">
              <span class="material-symbols-outlined"> add_2 </span>
              <p>new</p>
            </button>
            <div class="list" id="rule-list"></div>
          </div>
          <form id="rule-form">
            <input id="rule-title" type="text" placeholder="Name this rule" />
            <textarea id="rule-content" rows="12" placeholder="The system prompt this rule applies"></textarea>
            <footer>
              <button type="button" class="remove" @click="rule_delete">delete</button>
              <button type="button" class="submit" @click="rule_save">save</button>
            </footer>
          </form>
        </section>

        <section :elif="params.tab == Knowledge" class="editor">
          <div class="side">
            <button type="button" class="new" @click="knowledge_reset">
              <span class="material-symbols-outlined"> add_2 </span>
              <p>new</p>
            </button>
            <div class="list" id="knowledge-list"></div>
          </div>
          <form id="knowledge-form">
            <input
              id="knowledge-title"
              type="text"
              maxlength="32"
              placeholder="Name this knowledge (defaults to the first line)"
            />
            <textarea id="knowledge-content" rows="12" placeholder="What the agent should know"></textarea>
            <footer>
              <button type="button" class="remove" @click="knowledge_delete">delete</button>
              <button type="button" class="submit" @click="knowledge_save">save</button>
            </footer>
          </form>
        </section>
      </section>
      <!---->
      <section :elif="params.page == config" class="config">
        <header :data-selected="{{params.tab}}">
          <a :for="(k, v) in configTab" :href="?page=config&tab={{k}}" :name="{{k}}">
            <span class="material-symbols-outlined"> {{v}} </span>
            <p>{{k}}</p>
          </a>
          <div></div>
        </header>

        <section :if="params.tab == Model" class="editor">
          <div class="side">
            <button type="button" class="new" name="add-provider" @click="model_add">
              <span class="material-symbols-outlined"> add_2 </span>
              <p>Add provider</p>
            </button>
            <button type="button" class="new" name="routing" @click="model_routing">
              <span class="material-symbols-outlined"> checklist </span>
              <p>Setting Models</p>
            </button>
            <div class="list" id="model-list"></div>
          </div>
          <form id="model-form" data-view="add">
            <section class="tools" id="model-catalog"></section>
            <section class="tools" id="model-routing"></section>
            <section class="tools" id="model-models"></section>
          </form>
        </section>

        <section :elif="params.tab == MCP" class="editor">
          <div class="side">
            <button type="button" class="new" @click="mcp_reset">
              <span class="material-symbols-outlined"> add_2 </span>
              <p>new</p>
            </button>
            <div class="list" id="mcp-list"></div>
          </div>
          <form id="mcp-form" data-transport="stdio">
            <input id="mcp-name" type="text" maxlength="64" placeholder="Server name" />
            <div class="row">
              <select id="mcp-transport" @change="mcp_transport">
                <option value="stdio">stdio · local command</option>
                <option value="http">http · remote endpoint</option>
              </select>
              <select id="mcp-auth" @change="mcp_auth">
                <option value="">header auth · or none</option>
                <option value="oauth">oauth</option>
              </select>
            </div>
            <div class="field" data-transport="stdio">
              <input id="mcp-command" type="text" placeholder="Command, e.g. npx" />
              <textarea id="mcp-args" rows="3" placeholder="Arguments · one per line"></textarea>
              <textarea id="mcp-env" rows="3" placeholder="Environment · KEY=value per line"></textarea>
            </div>
            <div class="field" data-transport="http">
              <input id="mcp-url" type="text" placeholder="https://example.com/mcp" />
              <textarea
                id="mcp-headers"
                rows="3"
                placeholder="Headers · Key: value per line · a bare Authorization value gets a Bearer prefix"
              ></textarea>
            </div>
            <section class="oauth" id="mcp-oauth"></section>
            <section class="tools" id="mcp-tools"></section>
            <footer>
              <button type="button" class="remove" @click="mcp_delete">delete</button>
              <button type="button" @click="mcp_reconnect">reconnect</button>
              <button type="button" id="mcp-login" @click="mcp_login">login</button>
              <button type="button" id="mcp-logout" @click="mcp_logout">logout</button>
              <button type="button" class="submit" @click="mcp_save">save</button>
            </footer>
          </form>
        </section>

        <section :elif="params.tab == Keychain" class="editor">
          <div class="side">
            <button type="button" class="new" @click="keychain_reset">
              <span class="material-symbols-outlined"> add_2 </span>
              <p>new</p>
            </button>
            <div class="list" id="keychain-list"></div>
          </div>
          <form id="keychain-form">
            <input id="keychain-name" type="text" maxlength="128" placeholder="Key name, e.g. GEMINI_API_KEY" />
            <input
              id="keychain-value"
              type="password"
              autocomplete="off"
              placeholder="Value · stored in the OS keychain, never shown again"
            />
            <footer>
              <button type="button" class="remove" @click="keychain_delete">delete</button>
              <button type="button" class="submit" @click="keychain_save">save</button>
            </footer>
          </form>
        </section>

        <section :elif="params.tab == Channel" class="editor">
          <div class="side">
            <button type="button" class="new" name="admin" @click="channel_admin">
              <span class="material-symbols-outlined"> send </span>
              <p>Admin Channel</p>
            </button>
            <button type="button" class="channel" name="telegram" @click="channel_telegram">
              <i class="fa-brands fa-telegram"></i>
              <p>Telegram</p>
              <span class="state"></span>
            </button>
            <button type="button" class="channel" name="discord" @click="channel_discord">
              <i class="fa-brands fa-discord"></i>
              <p>Discord</p>
              <span class="state"></span>
            </button>
          </div>
          <form id="channel-form" data-view="channel">
            <div class="status" id="channel-status"></div>
            <section class="tools" id="channel-admin"></section>
            <input id="channel-token" type="password" autocomplete="off" placeholder="Bot token · required to enable" />
            <footer>
              <button type="button" class="remove" @click="channel_disable">disable</button>
              <button type="button" class="submit" @click="channel_enable">enable</button>
            </footer>
          </form>
        </section>
      </section>
    </section>
    <!---->
    <section class="toast" id="toast"></section>
  </body>
</html>
